<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>learnhub</title>

    <style>
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
        color: #ffffff;
        font-family: system-ui, sans-serif;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 24px;
      }

      .loader-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #e50914;
        color: #ffffff;
        font-size: 28px;
      }

      .loader-logo h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .loader-logo h1 span {
        color: #e50914;
      }

      .loader-track {
        width: 200px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: #262626;
      }

      .loader-progress {
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #e50914;
        animation: loading 1.2s ease-in-out infinite alternate;
      }

      .loader-content p {
        margin: 0;
        color: #9ca3af;
        font-size: 13px;
      }

      .logo-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: #e50914;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        font-family: system-ui, sans-serif;
      }

      @keyframes loading {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(120%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-progress {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-loader">
      <div class="loader-content">
        <div class="loader-logo">
          <div class="logo-icon">H</div>
          <h1>Learn<span>Hub</span></h1>
        </div>

        <div class="loader-track">
          <div class="loader-progress"></div>
        </div>

        <p>Preparing your learning experience...</p>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
